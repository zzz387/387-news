name: 387 News — 003-R public source checks (no Gemini)
on:
  push:
    branches: [codex/reissue-003-r]
  pull_request:
    paths: ['scripts/**', 'config/special-003-r.json', '.github/workflows/special*.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<49'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -q
      - name: Read all eleven public original URLs and document rights without models
        env:
          SPECIAL_SOURCE_REPORT: ${{ runner.temp }}/special-sources.json
        run: python -m scripts.special003r --probe
      - uses: actions/upload-artifact@v4
        with:
          name: 003-R-public-source-diagnostics
          path: ${{ runner.temp }}/special-sources.json
          retention-days: 30
