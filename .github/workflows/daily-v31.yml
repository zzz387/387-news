        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.backup44
      - uses: actions/upload-artifact@v4
        with:
          name: 387news44-backup-pre-mosaic-20261118
          path: ${{ runner.temp }}/pre-mosaic-backup/
          retention-days: 90
          if-no-files-found: error
