name: 387 News — autonomous daily edition
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'run' || inputs.phase == 'publish') && !inputs.preview && inputs.target_date != '' && format('Delivery {0}', inputs.target_date) || format('387 News {0}', github.event_name) }}

on:
  push:
    branches: [main, codex/editorial-policy-v41]
    paths: ['scripts/**', 'config/**', 'assets/**', 'docs/editorial-policy-v4.1.md', '.github/workflows/daily-v31.yml']
  pull_request:
    paths: ['scripts/**', 'config/**', 'assets/**', 'docs/editorial-policy-v4.1.md', '.github/workflows/daily-v31.yml']
  schedule:
    # Every cron wakes the same state-driven controller. UTC = Moscow minus 3h.
    - cron: '17 9,11,13,15,17,19,21,22 * * *'
    - cron: '17 0,1,2 * * *'
    # Prepare and wait until 06:00 Moscow when ready; late wake-ups publish immediately.
    - cron: '54 2 * * *'
    # Independent morning recovery opportunities: 06:17, 06:37, 06:54, 07:15, 07:30, 08:15.
    - cron: '17,37,54 3 * * *'
    - cron: '15,30 4 * * *'
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'run: automatic next action; inspect: restore only; preview prevents publication'
        type: choice
        options: [run, inspect, check, plan, research, write, audit, publish, resume, status, backfill_issue_art, recover_missing_issue, trial, trial-inspect, trial-route]
        default: run
        required: true
      preview:
        description: 'TEST mode: never publish to 387.su (keep checked)'
        type: boolean
        default: true
        required: true
      target_date:
        description: 'Optional YYYY-MM-DD (usually leave blank)'
        type: string
        required: false

      repair_legacy_images:
        description: 'Owner-authorized targeted replacement of Schnell illustrations in issue 029 only'
        type: boolean
        default: false
        required: false

      trial_approved_sha:
        description: 'Trial only: exact reviewed 40-character commit SHA'
        type: string
        required: false
      trial_confirmation:
        description: 'Trial only: RUN_V41_TRIAL_WITH_GEMINI after separate owner permission'
        type: string
        required: false

      trial_review_public_key:
        description: 'Optional owner PUBLIC RSA SPKI base64, generated on the owner PC; never a private or production key'
        type: string
        required: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.phase, 'trial')) && format('387-news-trial-review-{0}', github.run_id) || (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && format('387-news-ci-{0}-{1}-{2}', github.event_name, github.ref, github.sha) || '387-news-stage-v31' }}
  cancel-in-progress: false

jobs:
  browser-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<49' 'Pillow>=11,<13' playwright
      - name: Use preinstalled runner Chromium or install bundled fallback
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo 'NEWS_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Probe changed museum adapter using public metadata only (no Secrets or models)
        run: |
          if ! git diff --quiet HEAD^ HEAD -- scripts/art_library44.py; then
            python -m scripts.art_library44 --probe-source --output '${{ runner.temp }}/museum-source44-report.json'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-museum-source44-contract
          path: ${{ runner.temp }}/museum-source44-report.json
          retention-days: 7
          if-no-files-found: ignore
      - id: scope
        run: python -m scripts.ci_scope
      - name: Check 12 synthetic pages at mobile and desktop widths (no Secrets or Gemini)
        if: steps.scope.outputs.legacy == 'true'
        run: python -m scripts.browser41 --synthetic --output '${{ runner.temp }}/browser-report.json'
      - name: Check archived policy 4.3 readers when their dependencies change
        if: steps.scope.outputs.legacy == 'true'
        run: python -m scripts.browser43 --synthetic --output '${{ runner.temp }}/browser43-report.json'
      - name: Check policy 4.4 twenty articles and sixteen briefs at four widths
        run: python -m scripts.browser44 --output '${{ runner.temp }}/browser44-report.json'
      - name: Verify actual translated originals when provider integration changes
        if: steps.scope.outputs.translation == 'true'
        run: python -m scripts.translation_browser43 --output '${{ runner.temp }}/translation43-report.json'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.scope.outputs.translation == 'true' }}
        with:
          name: v43-public-translation-browser-diagnostics
          path: ${{ runner.temp }}/translation43-report.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: v43-synthetic-browser-diagnostics
          path: |
            ${{ runner.temp }}/browser43-report.json
            ${{ runner.temp }}/browser44-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.legacy == 'true'
        with:
          name: v41-synthetic-browser-diagnostics
          path: ${{ runner.temp }}/browser-report.json
          retention-days: 7

  catalog-discovery-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        run: python -m scripts.ci_scope
      - name: Check publisher discovery robots full-text access and per-article rights (public only no Gemini)
        if: steps.scope.outputs.sources == 'true'
        run: python -m scripts.catalog43 --output '${{ runner.temp }}/catalog43-report.json'
      - name: Measure adaptive family health sport and light public discovery (no checkpoint or Gemini)
        if: steps.scope.outputs.sources == 'true'
        env:
          NEWS_LIGHT_NEWS_ENABLED: 'true'
          NEWS_POLICY_VERSION: '4.4'
        run: python -m scripts.catalog43 --core-search --output '${{ runner.temp }}/core-search43-report.json'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.scope.outputs.sources == 'true' }}
        with:
          name: public-core-search43-diagnostics
          path: ${{ runner.temp }}/core-search43-report.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.scope.outputs.sources == 'true' }}
        with:
          name: public-catalog43-diagnostics
          path: ${{ runner.temp }}/catalog43-report.json
          retention-days: 7
          if-no-files-found: warn

  source-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        run: python -m scripts.ci_scope
      - name: Inspect public originals only (no Secrets, no Gemini, no drafts)
        if: steps.scope.outputs.sources == 'true'
        run: python scripts/source_probe41.py --output '${{ runner.temp }}/source-report.json'
      - name: Check real policy 4.4 brief publishers without Gemini or Secrets
        if: steps.scope.outputs.sources == 'true'
        run: python -m scripts.source_probe44 --output '${{ runner.temp }}/source44-report.json'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.scope.outputs.sources == 'true' }}
        with:
          name: v41-public-source-diagnostics
          path: |
            ${{ runner.temp }}/source-report.json
            ${{ runner.temp }}/source44-report.json
          retention-days: 7

  public-health:
    if: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'status') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check only the public website over verified HTTPS
        env:
          MANUAL_DATE: ${{ inputs.target_date }}
        shell: bash
        run: |
          arguments=()
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            arguments+=(--expected-date "$(TZ=Europe/Moscow date +%F)")
          elif [[ -n "$MANUAL_DATE" ]]; then
            arguments+=(--expected-date "$MANUAL_DATE")
          fi
          python -m scripts.site_checks "${arguments[@]}"

  unit-tests:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<49' 'Pillow>=11,<13'
      - name: Full offline regression with compact output
        run: python -m scripts.run_tests --full --log '${{ runner.temp }}/unit-tests.log' --report '${{ runner.temp }}/unit-summary.json'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: unit-test-diagnostics
          path: |
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/unit-summary.json
          retention-days: 7



  trial-route:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/editorial-policy-v41' && inputs.phase == 'trial-route' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<49' 'Pillow>=11,<13'
      - name: Verify real owner dispatch routing with no Secrets or Gemini
        env:
          TRIAL_APPROVED_SHA: ${{ inputs.trial_approved_sha }}
          TRIAL_PREVIEW: ${{ inputs.preview }}
        run: python scripts/trial41.py --route-only

  trial-approval:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/editorial-policy-v41' && (inputs.phase == 'trial' || inputs.phase == 'trial-inspect') }}
    runs-on: ubuntu-latest
    environment: 387-news-v41-trial
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<49' 'Pillow>=11,<13'
      - name: Verify owner permission, pinned commit and required environment reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_APPROVED_SHA: ${{ inputs.trial_approved_sha }}
          TRIAL_CONFIRMATION: ${{ inputs.trial_confirmation }}
          TRIAL_REVIEW_PUBLIC_KEY: ${{ inputs.trial_review_public_key }}
          TRIAL_PREVIEW: ${{ inputs.preview }}
          TARGET_DATE: ${{ inputs.target_date }}
          TRIAL_INSPECT: ${{ inputs.phase == 'trial-inspect' }}
        shell: bash
        run: |
          arguments=(--preflight)
          if [[ "$TRIAL_INSPECT" == 'true' ]]; then arguments+=(--inspect); fi
          python scripts/trial41.py "${arguments[@]}"

  trial:
    needs: trial-approval
    if: ${{ needs.trial-approval.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Acquire the SAME quota lock as production only after the owner review.
    concurrency:
      group: 387-news-stage-v31
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NEWS_RELEASE_APPROVED: 'false'
      NEWS_V41_TRIAL: 'true'
      NEWS_MAX_REQUESTS_PER_RUN: '24'
      NEWS_MAX_REQUESTS_PER_DAY: '220'
      NEWS_REQUEST_GAP_SECONDS: '6'
      NEWS_STAGE_SECONDS: '720'
      GEMINI_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      TRIAL_APPROVED_SHA: ${{ inputs.trial_approved_sha }}
      TRIAL_CONFIRMATION: ${{ inputs.trial_confirmation }}
      TRIAL_REVIEW_PUBLIC_KEY: ${{ inputs.trial_review_public_key }}
      TRIAL_PREVIEW: ${{ inputs.preview }}
      TRIAL_INSPECT: ${{ inputs.phase == 'trial-inspect' }}
      TARGET_DATE: ${{ inputs.target_date }}
      PHASE: run
      PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read current main for production priority and archive checks only
        uses: actions/checkout@v4
        with:
          ref: main
          path: .trial-production-readonly
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<49' 'Pillow>=11,<13' playwright
      - run: python -m playwright install --with-deps chromium
      - name: Select trial checkpoint and shared daily ledger
        id: checkpoint
        run: python scripts/locate_checkpoint.py
      - name: Restore encrypted trial checkpoint using the official action
        if: ${{ steps.checkpoint.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.artifact_id }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/checkpoint
          merge-multiple: true
      - name: Restore the production-shared quota ledger
        if: ${{ steps.checkpoint.outputs.quota_found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.quota_id }}
          run-id: ${{ steps.checkpoint.outputs.quota_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/quota
          merge-multiple: true
      - name: Restore special checkpoint for shared quota recovery only
        if: ${{ steps.checkpoint.outputs.special_quota_found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.special_quota_id }}
          run-id: ${{ steps.checkpoint.outputs.special_quota_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/special-quota-backup
          merge-multiple: true
      - name: Restore upcoming production checkpoint for read-only quota priority
        if: ${{ steps.checkpoint.outputs.production_found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.production_id }}
          run-id: ${{ steps.checkpoint.outputs.production_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/production-checkpoint
          merge-multiple: true
      - name: Prepare or inspect the private full edition; never publish
        id: trial
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRAFT_ENCRYPTION_KEY: ${{ secrets.DRAFT_ENCRYPTION_KEY }}
          NEWS_CHECKPOINT_FILE: ${{ runner.temp }}/checkpoint/news-draft.enc
          NEWS_CHECKPOINT_EXPECTED: ${{ steps.checkpoint.outputs.found }}
          NEWS_QUOTA_FILE: ${{ runner.temp }}/quota/quota.json
          NEWS_QUOTA_EXPECTED: ${{ steps.checkpoint.outputs.quota_found }}
          NEWS_SPECIAL_QUOTA_FILE: ${{ runner.temp }}/special-quota-backup/special-003-r.enc
          NEWS_SPECIAL_QUOTA_EXPECTED: ${{ steps.checkpoint.outputs.special_quota_found }}
          NEWS_PRODUCTION_ROOT: ${{ github.workspace }}/.trial-production-readonly
          NEWS_PRODUCTION_CHECKPOINT_EXPECTED: ${{ steps.checkpoint.outputs.production_found }}
          NEWS_PRODUCTION_CHECKPOINT_FILE: ${{ runner.temp }}/production-checkpoint/news-draft.enc
        shell: bash
        run: |
          arguments=()
          if [[ "$TRIAL_INSPECT" == 'true' ]]; then arguments+=(--inspect); fi
          python scripts/trial41.py "${arguments[@]}"
      - name: Retain encrypted trial progress only
        if: ${{ always() && steps.trial.outputs.checkpoint == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trial.outputs.artifact_name }}
          path: ${{ runner.temp }}/news-draft.enc
          retention-days: 7
          if-no-files-found: error
      - name: Retain shared request reservations even on failure
        if: ${{ always() && steps.trial.outputs.quota == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trial.outputs.quota_name }}
          path: ${{ runner.temp }}/quota/quota.json
          retention-days: 90
          if-no-files-found: error
      - name: Retain encrypted HTML Markdown screenshots and checks
        if: ${{ success() && steps.trial.outputs.trial_complete == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: v41-private-review-${{ inputs.target_date }}-${{ github.run_id }}
          path: ${{ runner.temp }}/trial-review.enc
          retention-days: 7
          if-no-files-found: error

      - name: Retain independently encrypted owner reader bundle
        if: ${{ success() && steps.trial.outputs.owner_review_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: v41-owner-review-${{ inputs.target_date }}-${{ github.run_id }}
          path: ${{ runner.temp }}/owner-review.enc
          retention-days: 7
          if-no-files-found: error

  prepare:
    # Owner authorized direct v4.1 production rollout on 2026-10-26.
    # Repository variables and all technical/editorial publication gates remain mandatory.
    if: ${{ github.ref == 'refs/heads/main' && always() && !startsWith(inputs.phase, 'trial') && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[special setup]') && !contains(github.event.head_commit.message, '[maintenance only]') && vars.NEWS_AUTOMATION_V31_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.phase != 'status') || (github.event_name == 'schedule' && vars.NEWS_AUTOMATION_V31_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEWS_POLICY_VERSION: "4.4"
      NEWS_REPAIR_LEGACY_IMAGES: ${{ (inputs.repair_legacy_images || (github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-legacy-art]'))) && 'true' || 'false' }}
      NEWS_ART_LIBRARY_ROLLOUT: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[art-library]') }}
      NEWS_CATALOG_REFRESH: "true"
      NEWS_LIGHT_NEWS_ENABLED: "true"
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEWS_HISTORICAL_RECOVERY_DATE: ${{ inputs.phase == 'recover_missing_issue' && inputs.target_date == '2026-11-20' && '2026-11-20' || '' }}
      CF_FREE_SMOKE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[cf-art]') || contains(github.event.head_commit.message, '[art-nov22]')) }}
      DRAFT_ENCRYPTION_KEY: ${{ secrets.DRAFT_ENCRYPTION_KEY }}
      NEWS_RELEASE_APPROVED: ${{ vars.NEWS_RELEASE_APPROVED }}
      NEWS_MAX_REQUESTS_PER_RUN: "24"
      NEWS_MAX_REQUESTS_PER_DAY: "220"
      NEWS_REQUEST_GAP_SECONDS: "6"
      NEWS_STAGE_SECONDS: "720"
      GEMINI_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash
    outputs:
      ready: ${{ steps.commit.outputs.ready }}
      issue_date: ${{ steps.commit.outputs.issue_date || steps.stage.outputs.issue_date }}
      pipeline_status: ${{ steps.stage.outputs.pipeline_status }}
    steps:
      - name: Read website repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption library
        run: python -m pip install 'cryptography>=44,<49' 'Pillow>=11,<13'
      - name: Verify existing production configuration without revealing values
        env:
          NEWS_AUTOMATION_V31_ENABLED: ${{ vars.NEWS_AUTOMATION_V31_ENABLED }}
        run: python scripts/production_preflight41.py
      - name: Resolve phase and release date
        id: context
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PHASE: ${{ inputs.phase }}
          MANUAL_PREVIEW: ${{ inputs.preview }}
          MANUAL_DATE: ${{ inputs.target_date }}
          CF_ART_ROLLOUT: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cf-art]') }}
          ART_LIBRARY_ROLLOUT: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[art-library]') }}
          NOV22_ART_ROLLOUT: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[art-nov22]') }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            phase="$MANUAL_PHASE"
            preview="$MANUAL_PREVIEW"
          else
            phase=run
            preview=false
          fi
          if [[ "$NEWS_REPAIR_LEGACY_IMAGES" == 'true' ]]; then phase=backfill_issue_art; MANUAL_DATE=2026-11-23; fi
          if [[ "$CF_ART_ROLLOUT" == 'true' ]]; then phase=backfill_issue_art; MANUAL_DATE=2026-11-21; fi
          if [[ "$NOV22_ART_ROLLOUT" == 'true' ]]; then phase=backfill_issue_art; MANUAL_DATE=2026-11-22; fi
          if [[ "$ART_LIBRARY_ROLLOUT" == 'true' ]]; then
            phase=backfill_issue_art
            MANUAL_DATE=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Europe/Moscow")).date())')
          fi
          PHASE="$phase" PREVIEW="$preview" TARGET_DATE="$MANUAL_DATE" python scripts/release_queue.py
      - name: Find previously saved encrypted checkpoint
        id: checkpoint
        env:
          NEWS_ART_COMPARISON_DIR: ${{ runner.temp }}/art-repair-comparison
          PHASE: ${{ steps.context.outputs.phase }}
          PREVIEW: ${{ steps.context.outputs.preview }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
        run: python scripts/locate_checkpoint.py
      - name: Download existing encrypted checkpoint (official GitHub action)
        if: ${{ steps.checkpoint.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.artifact_id }}
          # Mandatory for an artifact created by an EARLIER workflow run.
          # Without run-id the action searches this run and returns 0 artifacts.
          run-id: ${{ steps.checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/checkpoint
          merge-multiple: true  # v4: artifact-ids otherwise nests under its name
      - name: Download shared daily request ledger
        if: ${{ steps.checkpoint.outputs.quota_found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_ARTIFACT_ID: ${{ steps.checkpoint.outputs.quota_id }}
        shell: bash
        run: |
          [[ "$QUOTA_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$QUOTA_ARTIFACT_ID/zip" > "$RUNNER_TEMP/quota-exact.zip"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.locate_checkpoint import extract_quota_archive
          root=Path(os.environ['RUNNER_TEMP'])
          extract_quota_archive(root/'quota-exact.zip',root/'quota'/'quota.json')
          print('EXACT_QUOTA_ARTIFACT_RESTORED')
          PY
      - name: Restore shared encrypted editorial inventory
        if: ${{ steps.checkpoint.outputs.stock_found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_ARTIFACT_ID: ${{ steps.checkpoint.outputs.stock_id }}
        shell: bash
        run: |
          [[ "$STOCK_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$STOCK_ARTIFACT_ID/zip" > "$RUNNER_TEMP/stock-exact.zip"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.locate_checkpoint import extract_stock_archive
          root=Path(os.environ['RUNNER_TEMP'])
          extract_stock_archive(root/'stock-exact.zip',root/'editorial-stock'/'editorial-stock.enc')
          print('EXACT_ENCRYPTED_STOCK_RESTORED')
          PY
      - name: Restore special checkpoint for shared quota recovery only
        if: ${{ steps.checkpoint.outputs.special_quota_found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.special_quota_id }}
          run-id: ${{ steps.checkpoint.outputs.special_quota_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/special-quota-backup
          merge-multiple: true
      - name: Restore latest published edition for read-only light diagnostics
        if: ${{ steps.checkpoint.outputs.light_diagnostic_found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.light_diagnostic_id }}
          run-id: ${{ steps.checkpoint.outputs.light_diagnostic_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/published-light-diagnostic
          merge-multiple: true
      - name: Diagnose saved light batch without model calls or private logs
        if: ${{ steps.checkpoint.outputs.light_diagnostic_found == 'true' }}
        run: python -m scripts.light43 --diagnose-checkpoint '${{ runner.temp }}/published-light-diagnostic/news-draft.enc'
      - name: Check Cloudflare Free safeguards without billing changes
        env:
          PROBE_IMAGE_MODELS: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[art-finalization]') || contains(github.event.head_commit.message, '[cf-art]') || contains(github.event.head_commit.message, '[art-nov22]')) }}
        run: |
          if [[ "$PROBE_IMAGE_MODELS" == 'true' ]]; then
            python -m scripts.mosaic44 --diagnose --probe-models
          else
            python -m scripts.mosaic44 --diagnose
          fi
      - name: Prepare encrypted draft checkpoint or release
        id: stage
        timeout-minutes: 20
        env:
          NEWS_ART_COMPARISON_DIR: ${{ runner.temp }}/art-repair-comparison
          PHASE: ${{ steps.context.outputs.phase }}
          PREVIEW: ${{ steps.context.outputs.preview }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          NEWS_CHECKPOINT_FILE: ${{ runner.temp }}/checkpoint/news-draft.enc
          NEWS_CHECKPOINT_EXPECTED: ${{ steps.checkpoint.outputs.found }}
          NEWS_QUOTA_FILE: ${{ runner.temp }}/quota/quota.json
          NEWS_STOCK_FILE: ${{ runner.temp }}/editorial-stock/editorial-stock.enc
          NEWS_STOCK_EXPECTED: ${{ steps.checkpoint.outputs.stock_found }}
          NEWS_QUOTA_EXPECTED: ${{ steps.checkpoint.outputs.quota_found }}
          NEWS_SPECIAL_QUOTA_FILE: ${{ runner.temp }}/special-quota-backup/special-003-r.enc
          NEWS_SPECIAL_QUOTA_EXPECTED: ${{ steps.checkpoint.outputs.special_quota_found }}
          NEWS_LONGFORM_GAP_SECONDS: "6"  # stay below free-tier 15 RPM during longform drafting
        shell: bash
        run: |
          arguments=(--phase "$PHASE")
          if [[ "$PREVIEW" == 'true' ]]; then arguments+=(--preview); fi
          if [[ -n "$TARGET_DATE" ]]; then arguments+=(--target-date "$TARGET_DATE"); fi
          python -m scripts.staged_news "${arguments[@]}"
      - name: Save artwork-only comparison gallery (approved public articles only)
        if: ${{ always() && env.NEWS_REPAIR_LEGACY_IMAGES == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: art-repair-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/art-repair-comparison
          if-no-files-found: ignore
      - name: Save encrypted checkpoint only (never plain draft)
        if: ${{ always() && steps.stage.outputs.checkpoint == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/news-draft.enc
          if-no-files-found: error
          retention-days: 90
      - name: Save shared daily request ledger (counts only)
        if: ${{ always() && steps.stage.outputs.quota == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.quota_name }}
          path: ${{ runner.temp }}/quota/quota.json
          if-no-files-found: error
          retention-days: 90
      - name: Save only encrypted shared editorial inventory
        if: ${{ always() && steps.stage.outputs.stock == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: 387news43-editorial-stock
          path: ${{ runner.temp }}/editorial-stock.enc
          if-no-files-found: error
          retention-days: 30
      - name: Project compact current home without modifying immutable editions
        id: home
        if: ${{ success() && steps.context.outputs.preview == 'false' && (steps.context.outputs.phase == 'run' || steps.context.outputs.phase == 'resume' || steps.context.outputs.phase == 'publish') }}
        run: python -m scripts.publication43 --refresh-home
      - name: Install browser only for a fully audited release
        if: ${{ success() && (steps.stage.outputs.published == 'true' || steps.home.outputs.ready == 'true') }}
        run: |
          python -m pip install playwright
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo 'NEWS_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify full release at phone tablet and desktop widths before Git commit
        if: ${{ success() && (steps.stage.outputs.published == 'true' || steps.home.outputs.ready == 'true') }}
        env:
          ISSUE_DATE: ${{ steps.stage.outputs.published == 'true' && steps.stage.outputs.issue_date || steps.home.outputs.issue_date }}
        run: python -m scripts.release_browser41
      - name: Commit fully audited and released issue
        id: commit
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.context.outputs.preview == 'false' && vars.NEWS_RELEASE_APPROVED == 'true' && (steps.stage.outputs.published == 'true' || steps.home.outputs.ready == 'true') }}
        shell: bash
        env:
          ISSUE_DATE: ${{ steps.stage.outputs.published == 'true' && steps.stage.outputs.issue_date || steps.home.outputs.issue_date }}
        run: |
          python -m scripts.release_queue --wait-until "$ISSUE_DATE"
          echo "issue_date=$ISSUE_DATE" >> "$GITHUB_OUTPUT"
          if [[ '${{ steps.stage.outputs.published }}' == 'true' ]]; then
            git add index.html archive/index.html issues/ sitemap.xml
            if [[ -d assets/illustrations ]]; then git add assets/illustrations; fi
          else
            git diff --exit-code -- issues/ archive/index.html sitemap.xml
            git add index.html
            if [[ -d assets/illustrations ]]; then git add assets/illustrations; fi
          fi
          if [[ -d art ]]; then git add art assets/art.css; fi
          if [[ -d assets/art ]]; then git add assets/art; fi
          if git diff --cached --quiet; then
            echo 'Approved issue already committed; retry deployment without changing the archive.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name '387 News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "387 News: staged verified issue $ISSUE_DATE"
          git push origin HEAD:main
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  deploy:
    # Only fully verified issues go to Pages. A separate job avoids GH Pages
    # environment restrictions applying to research/writing stages.
    needs: prepare
    if: ${{ always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' && !startsWith(inputs.phase, 'trial') && needs.prepare.outputs.ready == 'true' && vars.NEWS_RELEASE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest published version
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify generated issue exists
        shell: bash
        run: |
          test -f index.html
          test -f archive/index.html
          test -f CNAME
          ls -lah issues/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package only final public site files
        run: python -m scripts.site_checks --package '${{ runner.temp }}/public-site'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package published site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-site
      - name: Wait for Pages artifact metadata to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for attempt in {1..10}; do
            if found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .id"); then
              if [[ -n "$found" ]]; then exit 0; fi
            fi
            sleep 2
          done
          echo '::error::PAGES_ARTIFACT_METADATA_NOT_VISIBLE'
          exit 1
      - name: Deploy published edition
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the released issue on the public HTTPS site
        env:
          EXPECTED_DATE: ${{ needs.prepare.outputs.issue_date }}
        run: python -m scripts.site_checks --expected-date "$EXPECTED_DATE" --attempts 5

  monitor:
    needs: [prepare, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && !(github.event_name == 'push' && (contains(github.event.head_commit.message, '[special setup]') || contains(github.event.head_commit.message, '[maintenance only]'))) && !startsWith(inputs.phase, 'trial') && vars.NEWS_AUTOMATION_V31_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preview == false)) }}
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
      publication_status: ${{ steps.verify.outputs.publication_status }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify today's public release and reconcile one incident
        id: verify
        env:
          NEWS_POLICY_VERSION: "4.4"
          GH_TOKEN: ${{ github.token }}
          PIPELINE_STATUS: ${{ needs.prepare.outputs.pipeline_status }}
        run: python scripts/release_monitor.py
      - name: Save advisory composition of the HTTPS-verified published edition
        id: composition
        if: ${{ steps.verify.outputs.verified == 'true' }}
        continue-on-error: true
        run: python -m scripts.priorities43 --published-report --output '${{ runner.temp }}/editorial-composition43.json'
      - uses: actions/upload-artifact@v4
        if: ${{ steps.composition.outcome == 'success' }}
        continue-on-error: true
        with:
          name: editorial-composition-${{ github.run_id }}
          path: ${{ runner.temp }}/editorial-composition43.json
          retention-days: 30
          if-no-files-found: warn
      - name: Continue the explicitly authorized artwork repair (at most four runs per stage)
        if: ${{ steps.verify.outputs.verified == 'true' && (inputs.repair_legacy_images || (github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-legacy-art]'))) && fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.targets > 0 && fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.provider_status == 'READY' && fromJSON(needs.prepare.outputs.pipeline_status || '{}').cloudflare_art.cooldown_until == 0 && fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.repair_attempts < 4 && ((fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.stage == 'pilot' && !fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.pilot_ready) || (fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.stage == 'all' && fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.ready < fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.targets)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub keeps one pending run per concurrency group. Never evict a
          # queued daily production run to enqueue an artwork continuation.
          pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber) and .path == ".github/workflows/daily-v31.yml" and .head_branch == "main" and .event != "pull_request" and (.status == "queued" or .status == "pending" or .status == "in_progress" or .status == "waiting"))] | length')
          if [[ "$pending" != '0' ]]; then echo 'ART_REPAIR_YIELD_TO_PRODUCTION'; exit 0; fi
          gh workflow run daily-v31.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=backfill_issue_art -f preview=false -f target_date=2026-11-23 -f repair_legacy_images=true
      - name: Hand completed artwork-only repair back to normal daily preparation
        if: ${{ steps.verify.outputs.verified == 'true' && (inputs.repair_legacy_images || (github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-legacy-art]'))) && fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.stage == 'all' && fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.targets > 0 && fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.ready == fromJSON(needs.prepare.outputs.pipeline_status || '{}').artwork_backfill.targets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber) and .path == ".github/workflows/daily-v31.yml" and .head_branch == "main" and .event != "pull_request" and (.status == "queued" or .status == "pending" or .status == "in_progress" or .status == "waiting"))] | length')
          if [[ "$pending" != '0' ]]; then echo 'DAILY_PREPARATION_ALREADY_QUEUED'; exit 0; fi
          gh workflow run daily-v31.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=run -f preview=false
      - name: Continue the next unpublished issue once after final-art rollout
        if: ${{ steps.verify.outputs.verified == 'true' && github.event_name == 'push' && (contains(github.event.head_commit.message, '[art-finalization]') || contains(github.event.head_commit.message, '[cf-art]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_20: ${{ contains(github.event.head_commit.message, '[cf-art]') }}
        shell: bash
        run: |
          # Same workflow and global mutex: queued until this delivery finishes.
          # A dispatch event cannot enter this push-only step again.
          if [[ "$RECOVER_20" == 'true' ]]; then
            gh workflow run daily-v31.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=recover_missing_issue -f preview=false -f target_date=2026-11-20
          else
            gh workflow run daily-v31.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=run -f preview=false
          fi

      - name: Continue bounded historical recovery while useful free progress remains
        if: ${{ steps.verify.outputs.verified == 'true' && github.event_name == 'workflow_dispatch' && inputs.phase == 'recover_missing_issue' && inputs.target_date == '2026-11-20' && fromJSON(needs.prepare.outputs.pipeline_status || '{}').stage == 'PREPARING' && fromJSON(needs.prepare.outputs.pipeline_status || '{}').historical_recovery_runs < 3 && fromJSON(needs.prepare.outputs.pipeline_status || '{}').run_used > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-v31.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=recover_missing_issue -f preview=false -f target_date=2026-11-20

      - name: Resume authorized historical recovery after daily preparation is approved
        if: ${{ steps.verify.outputs.verified == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.phase == 'run' || inputs.phase == 'resume'))) && fromJSON(needs.prepare.outputs.pipeline_status || '{}').audit_passed == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A missed historical date precedes the newest archive and is not an
          # ordinary next-date task. Reuse the same mutex/restore path, only after
          # daily approval. Recovery dispatches cannot recurse through this step.
          if [[ ! -f issues/2026-11-20/release.json ]]; then
            gh workflow run daily-v31.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=recover_missing_issue -f preview=false -f target_date=2026-11-20
          fi

  special-003-r:
    needs: [prepare, deploy, monitor]
    # Daily owns the shared mutex first; this call never holds or delays daily preparation.
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' && needs.monitor.outputs.verified == 'true' && vars.NEWS_AUTOMATION_V31_ENABLED == 'true' && vars.NEWS_RELEASE_APPROVED == 'true' && !inputs.repair_legacy_images && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-legacy-art]')) && !startsWith(inputs.phase, 'trial') && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.preview == false && (inputs.phase == 'run' || inputs.phase == 'resume'))) }}
    uses: ./.github/workflows/special-003-r.yml
    with:
      daily_run_used: ${{ fromJSON(needs.prepare.outputs.pipeline_status || '{"run_used":24}').run_used }}
      priority_first: false
    secrets: inherit

  special-continue:
    needs: [special-003-r, prepare, deploy, monitor]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.special-003-r.result == 'success' && needs.special-003-r.outputs.continue_special == 'true' && needs.special-003-r.outputs.run_used != '' && (needs.special-003-r.outputs.run_used != '0' || fromJSON(needs.prepare.outputs.pipeline_status || '{"run_used":0}').run_used > 0) }}
