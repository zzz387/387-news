name: 387 News — autonomous daily edition

on:
  push:
    branches: [main, codex/editorial-policy-v41]
    paths: ['scripts/**', 'config/**', 'assets/**', 'docs/editorial-policy-v4.1.md', '.github/workflows/daily-v31.yml']
  pull_request:
    paths: ['scripts/**', 'config/**', 'assets/**', 'docs/editorial-policy-v4.1.md', '.github/workflows/daily-v31.yml']
  schedule:
    # Every cron wakes the same state-driven controller. UTC = Moscow minus 3h.
    - cron: '17 9,11,13,15,17,19,21,22 * * *'
    - cron: '17 0,1,2 * * *'
    # Prepare and wait until 06:00 Moscow when ready; late wake-ups publish immediately.
    - cron: '54 2 * * *'
    # Independent morning recovery opportunities: 06:17, 06:37, 06:54, 07:15, 07:30, 08:15.
    - cron: '17,37,54 3 * * *'
    - cron: '15,30 4 * * *'
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'run: automatic next action; inspect: restore only; preview prevents publication'
        type: choice
        options: [run, inspect, check, plan, research, write, audit, publish, resume, status]
        default: run
        required: true
      preview:
        description: 'TEST mode: never publish to 387.su (keep checked)'
        type: boolean
        default: true
        required: true
      target_date:
        description: 'Optional YYYY-MM-DD (usually leave blank)'
        type: string
        required: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && format('387-news-ci-{0}-{1}', github.event_name, github.ref) || '387-news-stage-v31' }}
  cancel-in-progress: false

jobs:
  source-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public originals only (no Secrets, no Gemini, no drafts)
        run: python scripts/source_probe41.py --output '${{ runner.temp }}/source-report.json'
      - uses: actions/upload-artifact@v4
        with:
          name: v41-public-source-diagnostics
          path: ${{ runner.temp }}/source-report.json
          retention-days: 7

  public-health:
    if: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'status') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check only the public website over verified HTTPS
        env:
          MANUAL_DATE: ${{ inputs.target_date }}
        shell: bash
        run: |
          arguments=()
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            arguments+=(--expected-date "$(TZ=Europe/Moscow date +%F)")
          elif [[ -n "$MANUAL_DATE" ]]; then
            arguments+=(--expected-date "$MANUAL_DATE")
          fi
          python scripts/site_checks.py "${arguments[@]}"

  unit-tests:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<49'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v

  prepare:
    # This is deliberately OFF by default. Enable with repository variable
    # NEWS_AUTOMATION_V31_ENABLED=true after test and editorial review.
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'push' && vars.NEWS_AUTOMATION_V31_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.phase != 'status') || (github.event_name == 'schedule' && vars.NEWS_AUTOMATION_V31_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DRAFT_ENCRYPTION_KEY: ${{ secrets.DRAFT_ENCRYPTION_KEY }}
      NEWS_RELEASE_APPROVED: ${{ vars.NEWS_RELEASE_APPROVED }}
      NEWS_MAX_REQUESTS_PER_RUN: "24"
      NEWS_MAX_REQUESTS_PER_DAY: "220"
      NEWS_REQUEST_GAP_SECONDS: "6"
      NEWS_STAGE_SECONDS: "720"
      GEMINI_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
    outputs:
      ready: ${{ steps.commit.outputs.ready }}
      issue_date: ${{ steps.stage.outputs.issue_date }}
      pipeline_status: ${{ steps.stage.outputs.pipeline_status }}
    steps:
      - name: Read website repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption library
        run: python -m pip install 'cryptography>=44,<49'
      - name: Run editorial policy and recovery unit tests (no API calls)
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Resolve phase and release date
        id: context
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PHASE: ${{ inputs.phase }}
          MANUAL_PREVIEW: ${{ inputs.preview }}
          MANUAL_DATE: ${{ inputs.target_date }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            phase="$MANUAL_PHASE"
            preview="$MANUAL_PREVIEW"
          else
            phase=run
            preview=false
          fi
          PHASE="$phase" PREVIEW="$preview" TARGET_DATE="$MANUAL_DATE" python scripts/release_queue.py
      - name: Find previously saved encrypted checkpoint
        id: checkpoint
        env:
          PHASE: ${{ steps.context.outputs.phase }}
          PREVIEW: ${{ steps.context.outputs.preview }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
        run: python scripts/locate_checkpoint.py
      - name: Download existing encrypted checkpoint (official GitHub action)
        if: ${{ steps.checkpoint.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.artifact_id }}
          # Mandatory for an artifact created by an EARLIER workflow run.
          # Without run-id the action searches this run and returns 0 artifacts.
          run-id: ${{ steps.checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/checkpoint
          merge-multiple: true  # v4: artifact-ids otherwise nests under its name
      - name: Download shared daily request ledger
        if: ${{ steps.checkpoint.outputs.quota_found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.quota_id }}
          run-id: ${{ steps.checkpoint.outputs.quota_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/quota
          merge-multiple: true
      - name: Prepare encrypted draft checkpoint or release
        id: stage
        timeout-minutes: 20
        env:
          PHASE: ${{ steps.context.outputs.phase }}
          PREVIEW: ${{ steps.context.outputs.preview }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          NEWS_CHECKPOINT_FILE: ${{ runner.temp }}/checkpoint/news-draft.enc
          NEWS_CHECKPOINT_EXPECTED: ${{ steps.checkpoint.outputs.found }}
          NEWS_QUOTA_FILE: ${{ runner.temp }}/quota/quota.json
          NEWS_QUOTA_EXPECTED: ${{ steps.checkpoint.outputs.quota_found }}
          NEWS_LONGFORM_GAP_SECONDS: "6"  # stay below free-tier 15 RPM during longform drafting
        shell: bash
        run: |
          arguments=(--phase "$PHASE")
          if [[ "$PREVIEW" == 'true' ]]; then arguments+=(--preview); fi
          if [[ -n "$TARGET_DATE" ]]; then arguments+=(--target-date "$TARGET_DATE"); fi
          python scripts/staged_news.py "${arguments[@]}"
      - name: Save encrypted checkpoint only (never plain draft)
        if: ${{ always() && steps.stage.outputs.checkpoint == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/news-draft.enc
          if-no-files-found: error
          retention-days: 90
      - name: Save shared daily request ledger (counts only)
        if: ${{ always() && steps.stage.outputs.quota == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.quota_name }}
          path: ${{ runner.temp }}/quota/quota.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit fully audited and released issue
        id: commit
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.context.outputs.preview == 'false' && vars.NEWS_RELEASE_APPROVED == 'true' && steps.stage.outputs.published == 'true' }}
        shell: bash
        run: |
          git add index.html archive/index.html issues/ sitemap.xml
          if git diff --cached --quiet; then
            echo 'Approved issue already committed; retry deployment without changing the archive.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name '387 News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "387 News: staged verified issue $(TZ=Europe/Moscow date +%F)"
          git push origin HEAD:main
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  deploy:
    # Only fully verified issues go to Pages. A separate job avoids GH Pages
    # environment restrictions applying to research/writing stages.
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && needs.prepare.outputs.ready == 'true' && vars.NEWS_RELEASE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest published version
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify generated issue exists
        shell: bash
        run: |
          test -f index.html
          test -f archive/index.html
          test -f CNAME
          ls -lah issues/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package only final public site files
        run: python scripts/site_checks.py --package '${{ runner.temp }}/public-site'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package published site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/public-site
      - name: Deploy published edition
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
      - name: Verify the released issue on the public HTTPS site
        env:
          EXPECTED_DATE: ${{ needs.prepare.outputs.issue_date }}
        run: python scripts/site_checks.py --expected-date "$EXPECTED_DATE" --attempts 5

  monitor:
    needs: [prepare, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && vars.NEWS_AUTOMATION_V31_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preview == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify today's public release and reconcile one incident
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_STATUS: ${{ needs.prepare.outputs.pipeline_status }}
        run: python scripts/release_monitor.py
