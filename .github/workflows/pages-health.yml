name: 387 News — Pages and checkpoint health (read only)

on:
  push:
    branches: [main, codex/pages-health]
    paths: ['.github/workflows/pages-health.yml']
  pull_request:
    paths: ['.github/workflows/pages-health.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  actions: read
  deployments: read

concurrency:
  group: 387-news-pages-health
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.repository == 'zzz387/387-news' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Pages deployment workflow and artifact metadata (GET only)
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='zzz387/387-news': raise RuntimeError('REPOSITORY_MISMATCH')
          def get(path):
              request=Request('https://api.github.com/repos/'+repo+'/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urlopen(request,timeout=30) as response:return json.load(response)
          def emit(tag,value):
              print('['+tag+'] '+json.dumps(value,ensure_ascii=False))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
                  stream.write('\n### '+tag+'\n\n```json\n'+json.dumps(value,ensure_ascii=False,indent=2)+'\n```\n')
          page=get('pages')
          emit('pages-api',{'checked_at':datetime.now(timezone.utc).isoformat(),
              'build_type':page.get('build_type'),'cname':page.get('cname'),
              'https_enforced':page.get('https_enforced'),'status':page.get('status')})
          if page.get('build_type')!='workflow':raise RuntimeError('PAGES_SOURCE_NOT_WORKFLOW')
          if page.get('cname')!='387.su' or page.get('https_enforced') is not True:
              raise RuntimeError('PAGES_DOMAIN_OR_HTTPS_NOT_VERIFIED')
          workflow=get('actions/workflows/daily-v31.yml')
          runs=get('actions/workflows/daily-v31.yml/runs?branch=main&per_page=10')['workflow_runs']
          production=[run for run in runs if run['event'] in ('push','schedule','workflow_dispatch')]
          emit('production-metadata',{'workflow_state':workflow['state'],
              'runs':[{'id':run['id'],'event':run['event'],'status':run['status'],
                       'conclusion':run['conclusion'],'created_at':run['created_at'],
                       'head_sha':run['head_sha']} for run in production[:5]]})
          if workflow['state']!='active':raise RuntimeError('PRODUCTION_WORKFLOW_NOT_ACTIVE')
          text=Path('.github/workflows/daily-v31.yml').read_text()
          for required in ('pages: write','id-token: write','name: github-pages',
                           'NEWS_MAX_REQUESTS_PER_RUN: "24"','NEWS_MAX_REQUESTS_PER_DAY: "220"',
                           'NEWS_REQUEST_GAP_SECONDS: "6"',"cron: '54 2 * * *'"):
              if required not in text:raise RuntimeError('PRODUCTION_PERMISSION_OR_SCHEDULE_MISSING')
          emit('deployment-permissions',{'pages':'write','id-token':'write','environment':'github-pages',
              'request_limits':[24,220],'gap_seconds':6,'release_time':'06:00 Europe/Moscow',
              'verification':'checked current main workflow configuration; no deployment or generation requested'})
          deployments=get('deployments?environment=github-pages&per_page=1')
          if deployments:
              deployment=deployments[0]
              statuses=get('deployments/'+str(deployment['id'])+'/statuses?per_page=1')
              emit('last-pages-deployment',{'id':deployment['id'],'sha':deployment['sha'],
                  'created_at':deployment['created_at'],'state':statuses[0].get('state') if statuses else None})
          def select(label):
              records=[]
              for page_number in range(1,101):
                  batch=get('actions/artifacts?per_page=100&name='+quote(label)+'&page='+str(page_number))['artifacts']
                  records.extend(row for row in batch if row['name']==label)
                  if len(batch)<100:break
              else:raise RuntimeError('ARTIFACT_LIST_INCOMPLETE')
              valid=[row for row in records if not row['expired']]
              if not valid:
                  if records:raise RuntimeError('SAVED_ARTIFACT_EXPIRED')
                  return None
              row=max(valid,key=lambda item:(item['created_at'],item['id']))
              if row.get('workflow_run',{}).get('head_branch')!='main':raise RuntimeError('ARTIFACT_ORIGIN_INVALID')
              return row
          checkpoint=select('387news31-production-2026-10-27')
          if not checkpoint:raise RuntimeError('OCTOBER_27_CHECKPOINT_NOT_FOUND')
          emit('checkpoint-metadata',{'date':'2026-10-27','artifact_id':checkpoint['id'],
              'run_id':checkpoint['workflow_run']['id'],'expired':checkpoint['expired'],
              'created_at':checkpoint['created_at'],'content_downloaded':False})
          day=datetime.now(timezone.utc).date().isoformat()
          ledger=select('387news31-quota-'+day)
          if not ledger:raise RuntimeError('CURRENT_DAY_LEDGER_NOT_FOUND')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('quota_id='+str(ledger['id'])+'\nquota_run='+str(ledger['workflow_run']['id'])+'\nquota_day='+day+'\n')
          emit('quota-metadata',{'artifact_id':ledger['id'],'run_id':ledger['workflow_run']['id'],
              'created_at':ledger['created_at'],'day':day,'read_only':True})
          PY
      - name: Read existing daily ledger with official artifact restoration
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.metadata.outputs.quota_id }}
          run-id: ${{ steps.metadata.outputs.quota_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/read-only-quota
          merge-multiple: true
      - name: Verify quota cooldown and public HTTPS without model calls
        env:
          QUOTA_PATH: ${{ runner.temp }}/read-only-quota/quota.json
          QUOTA_DAY: ${{ steps.metadata.outputs.quota_day }}
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts import site_checks
          path=Path(os.environ['QUOTA_PATH']);before=path.read_bytes()
          ledger=json.loads(before)
          if ledger.get('day')!=os.environ['QUOTA_DAY'] or type(ledger.get('requests')) is not int or not 0<=ledger['requests']<=220:
              raise RuntimeError('QUOTA_LEDGER_INVALID')
          cooldowns={}
          for model,until in ledger.get('cooldowns',{}).items():
              if not isinstance(until,(int,float)):raise RuntimeError('COOLDOWN_INVALID')
              cooldowns[model]={'until_moscow':datetime.fromtimestamp(until,ZoneInfo('Europe/Moscow')).isoformat(),
                                'active':until>datetime.now(timezone.utc).timestamp()}
          quota={'day':ledger['day'],'requests_used':ledger['requests'],'remaining_of_220':220-ledger['requests'],
                 'cooldowns':cooldowns,'model_requests_performed_by_health_job':0,'ledger_modified':False}
          print('[quota-read-only] '+json.dumps(quota,ensure_ascii=False))
          current=site_checks.check_site()
          current=site_checks.check_site(expected_date=current['issue_date'])
          issue=json.loads(site_checks.fetch('https://387.su/issues/2026-10-26/issue.json'))
          if issue['number']!=3 or issue['date']!='2026-10-26' or len(issue['articles'])!=8:
              raise RuntimeError('PUBLISHED_003_MANIFEST_CHANGED')
          # Explicitly read the existing edition's permanent overview and all article URLs too.
          overview=site_checks.fetch('https://387.su/issues/2026-10-26/')
          for article in issue['articles']:
              page=site_checks.fetch('https://387.su/issues/2026-10-26/articles/'+article['slug']+'/')
              if 'article-body' not in page:raise RuntimeError('PUBLISHED_003_ARTICLE_UNAVAILABLE')
          if path.read_bytes()!=before:raise RuntimeError('READ_ONLY_LEDGER_CHANGED')
          print('[public-https] '+json.dumps(current,ensure_ascii=False))
          print('[published-003] '+json.dumps({'date':issue['date'],'number':issue['number'],
              'articles':len(issue['articles']),'https':'verified','permanent_urls':'verified','publication_requested':False}))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('\n### Read-only ledger and public site\n\n```json\n'+json.dumps({'quota':quota,'public_site':current,
                  'existing_edition':{'date':issue['date'],'number':issue['number'],'articles':len(issue['articles'])}},ensure_ascii=False,indent=2)+'\n```\n')
          PY
