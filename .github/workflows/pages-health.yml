name: 387 News — Pages and checkpoint health (read only)

on:
  push:
    branches: [main, codex/pages-health]
    paths: ['.github/workflows/pages-health.yml', 'scripts/health41.py']
  pull_request:
    paths: ['.github/workflows/pages-health.yml', 'scripts/health41.py']
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  actions: read
  deployments: read

concurrency:
  group: 387-news-pages-health
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.repository == 'zzz387/387-news' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read current main as production reference only
        uses: actions/checkout@v4
        with:
          ref: main
          path: .health-production
          persist-credentials: false
      - name: Read current Pages, twelve hours of runs and dynamic checkpoint metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_PRODUCTION_ROOT: .health-production
        run: python -m scripts.health41 metadata
      - name: Read existing daily ledger with official artifact restoration
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.metadata.outputs.quota_id }}
          run-id: ${{ steps.metadata.outputs.quota_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/read-only-quota
          merge-multiple: true
      - name: Verify quota cooldown and public HTTPS without model calls
        env:
          QUOTA_PATH: ${{ runner.temp }}/read-only-quota/quota.json
          QUOTA_DAY: ${{ steps.metadata.outputs.quota_day }}
        run: python -m scripts.health41 public
      - name: Read model capabilities only; never generate diagnostic content
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.health41 models
